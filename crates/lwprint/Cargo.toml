[package]
name = "lwprint"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2"
anyhow = "1"
axum = "0.8"
base64 = "0.22"
bluer = { version = "0.17", features = ["rfcomm", "l2cap"] }
clap = { version = "4", features = ["derive", "env"] }
fontdb = "0.23"
image = { version = "0.25", default-features = false, features = ["png"] }
lw-core = { version = "0.1.0", path = "../lw-core" }
rumqttc = { version = "0.24", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "io-util", "rt-multi-thread", "net", "sync", "signal"] }
toml = "0.8"
